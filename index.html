<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI测试 (16personalities) - 治愈版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
        
        /* 治愈系背景 */
        body {
            background: linear-gradient(135deg, #FDFBF7 0%, #F0F4F8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4A4A4A;
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰云朵 */
        .bg-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            z-index: -1;
            animation: float 6s ease-in-out infinite;
        }
        .bg-cloud1 { width: 150px; height: 50px; top: 10%; left: -50px; animation-delay: 0s; }
        .bg-cloud2 { width: 200px; height: 60px; bottom: 15%; right: -80px; animation-delay: 2s; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #app { width: 100%; max-width: 700px; padding: 30px; position: relative; z-index: 1; }
        
        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ====== 治愈系首页 ====== */
        .header { text-align: center; margin-bottom: 35px; }
        
        /* 吉祥物云朵 */
        .mascot-container {
            display: inline-block;
            margin-bottom: 15px;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .main-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; color: #6B5B95; letter-spacing: 1px; }
        .sub-title { font-size: 15px; color: #888; }

        /* 四个卡片布局 */
        .cards-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 35px; 
        }

        .card { 
            padding: 25px 15px; 
            border-radius: 24px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.04); 
            border: 3px solid transparent;
        }
        
        /* 卡片不同底色 */
        .card.simple { background: #FFF0F5; } /* 浅粉 */
        .card.standard { background: #E8F4F8; } /* 浅蓝 */
        .card.pro { background: #FFF8E7; } /* 浅黄 */
        .card.complete { background: #F3E8FF; } /* 浅紫 */

        .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        
        .card.active { border-color: #FFB6C1; box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4); transform: scale(1.05); }
        .card.complete.active { border-color: #D8B4FE; box-shadow: 0 10px 25px rgba(216, 180, 254, 0.4); }

        .card-icon { width: 70px; height: 70px; margin: 0 auto 10px; }
        .card-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .card-desc { font-size: 13px; color: #777; margin-bottom: 12px; }
        .card-users { font-size: 11px; color: #AAA; background: rgba(255,255,255,0.6); padding: 4px 8px; border-radius: 10px; display: inline-block; }

        /* 开始按钮 */
        .start-btn { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 50px; 
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%); 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4);
            letter-spacing: 2px;
        }
        .start-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 154, 158, 0.6);
        }
        .start-btn:active { transform: translateY(1px); }

        /* ====== 以下为答题页与结果页原有样式（未作修改） ====== */
        .progress-container { width: 100%; height: 8px; background: #e0e0e0; border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #8b74ff, #6a5af9); width: 0%; transition: width 0.3s ease; }
        .question-meta { text-align: right; font-size: 13px; color: #888; margin-bottom: 20px; }
        .question-text { font-size: 20px; font-weight: 500; margin-bottom: 30px; line-height: 1.5; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 16px 18px; background: #ffffff; border: 2px solid transparent; border-radius: 12px; font-size: 15px; text-align: left; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .option-btn:hover { background: #fcfcfc; border-color: #d0c8ff; }
        .option-btn.selected { background: #f4f2ff; border-color: #6a5af9; color: #6a5af9; font-weight: bold; }

        .result-box { text-align: center; padding: 40px 20px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .result-type { font-size: 45px; font-weight: 900; color: #6a5af9; margin-bottom: 10px; letter-spacing: 5px; }
        .result-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .result-desc { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 30px; text-align: left; }
        .restart-btn { padding: 12px 30px; border: 2px solid #6a5af9; background: transparent; color: #6a5af9; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .restart-btn:hover { background: #6a5af9; color: #fff; }
    </style>
</head>
<body>

<!-- 治愈系背景装饰 -->
<div class="bg-cloud bg-cloud1"></div>
<div class="bg-cloud bg-cloud2"></div>

<div id="app">
    <!-- 首页 -->

                    <path d="M20 60C8.95431 60 0 51.0457 0 40C0 28.9543 8.95431 20 20 20C22.5 20 24.9 20.45 27.1 21.3C31.5 9.1 43.6 0 58 0C76 0 90 14 90 32C95.5 34.2 100 39.8 100 46C100 54.6 93 61 84 61H20V60Z" fill="#E2E8F0"/>

            </div>

            <!-- 专业版 (小兔) -->
            <div class="card pro" id="card-pro" onclick="selectVersion('pro', 145)">
                <div class="card-icon">

                    </svg>
                </div>
                <div class="card-title">145题</div>
                <div class="card-desc">专业版</div>
                <div class="card-users">精准分析</div>
            </div>

            <!-- 完整版 (小狐狸) -->
            <div class="card complete active" id="card-complete" onclick="selectVersion('complete', 200)">
                <div class="card-icon">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="55" r="35" fill="#FFE4D6"/>
                        <polygon points="15,20 45,45 5,55" fill="#FFB09C"/>
                        <polygon points="85,20 55,45 95,55" fill="#FFB09C"/>
                        <polygon points="20,25 40,45 10,50" fill="#FFD1DC"/>
                        <polygon points="80,25 60,45 90,50" fill="#FFD1DC"/>
                        <circle cx="38" cy="50" r="5" fill="#4A4A4A"/>
                        <circle cx="62" cy="50" r="5" fill="#4A4A4A"/>
                        <circle cx="30" cy="65" r="7" fill="#FF9AA2" opacity="0.6"/>
                        <circle cx="70" cy="65" r="7" fill="#FF9AA2" opacity="0.6"/>

                <div class="card-title">200题</div>
                <div class="card-desc">完整版</div>

        </div>

        <button class="start-btn" onclick="startQuiz()">✨ 开始测试 ✨</button>
    </div>

    <!-- 答题页 -->
    <div id="quiz-screen" class="screen">
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="question-meta" id="question-meta">第 1 题 / 共 200 题</div>
        <h2 class="question-text" id="question-text">加载中...</h2>
        <div class="options-container" id="options-container"></div>
    </div>

    <!-- 结果页 -->
    <div id="result-screen" class="screen">
        <div class="result-box">
            <div class="result-type" id="result-type">INTJ</div>
            <div class="result-title" id="result-title">建筑师</div>
            <div class="result-desc" id="result-desc"></div>
            <button class="restart-btn" onclick="restart()">重新测试</button>
        </div>

</div>

<script>
    // ================= 核心：200道题库 (与原版一致，未做修改) =================
    const questionBank = [
        // --- E/I 维度 (1-50) ---
        { text: "在社交聚会中，你通常会：", options: [{ t: "主动与很多人交谈，包括陌生人", v: "E" }, { t: "只与少数熟悉的朋友交谈", v: "I" }] },
        { text: "经过漫长的一天后，你更倾向于通过什么方式恢复精力？", options: [{ t: "外出与朋友聚会，享受热闹", v: "E" }, { t: "独处，安静地做自己喜欢的事", v: "I" }] },
        { text: "在会议或课堂上，你更倾向于：", options: [{ t: "随时举手发言，说出自己的想法", v: "E" }, { t: "先在心里思考成熟后再发言", v: "I" }] },
        { text: "你更喜欢的工作环境是：", options: [{ t: "开放、活跃、充满交流的团队环境", v: "E" }, { t: "安静、独立、能专注的个人空间", v: "I" }] },
        { text: "当遇到困难时，你通常会：", options: [{ t: "立刻找别人倾诉或寻求建议", v: "E" }, { t: "自己先思考清楚，再决定是否求助", v: "I" }] },
        { text: "在陌生的聚会上，你通常：", options: [{ t: "很快就能融入，主动认识新朋友", v: "E" }, { t: "需要一段时间才能放松下来", v: "I" }] },
        { text: "你认为自己是一个：", options: [{ t: "喜欢表达，倾向于边说边想的人", v: "E" }, { t: "善于倾听，倾向于先想后说的人", v: "I" }] },
        { text: "周末你更愿意：", options: [{ t: "安排丰富的社交活动，见不同的人", v: "E" }, { t: "宅在家里，享受一个人的时光", v: "I" }] },
        { text: "在团队合作中，你更倾向于：", options: [{ t: "担任领导者或协调者，积极推动进度", v: "E" }, { t: "做好分配的任务，默默贡献自己的力量", v: "I" }] },
        { text: "打电话和发信息相比，你更喜欢：", options: [{ t: "直接打电话，沟通更高效", v: "E" }, { t: "发文字信息，有更多思考余地", v: "I" }] },
        { text: "你更喜欢在什么样的环境下工作？", options: [{ t: "有背景噪音和人们交谈的咖啡馆", v: "E" }, { t: "绝对安静、不受打扰的图书馆", v: "I" }] },
        { text: "当你在思考一个复杂问题时，你倾向于：", options: [{ t: "找人讨论，在交流中理清思路", v: "E" }, { t: "独自思考，在脑海中推演", v: "I" }] },
        { text: "你觉得自己更容易被哪种人吸引？", options: [{ t: "热情开朗、充满活力的人", v: "E" }, { t: "沉稳内敛、有深度的人", v: "I" }] },
        { text: "在派对上，你更常做的是：", options: [{ t: "穿梭在人群中，与不同的人寒暄", v: "E" }, { t: "找到一个舒适角落，与一两人深聊", v: "I" }] },
        { text: "你更喜欢的假期方式是：", options: [{ t: "去热闹的城市，体验丰富的夜生活", v: "E" }, { t: "去宁静的乡村，享受自然的静谧", v: "I" }] },
        { text: "别人常评价你为：", options: [{ t: "开朗、健谈、容易亲近", v: "E" }, { t: "安静、神秘、需要慢慢了解", v: "I" }] },
        { text: "你更倾向于：", options: [{ t: "认识很多泛泛之交", v: "E" }, { t: "维护几个知心好友", v: "I" }] },
        { text: "在表达观点时，你通常：", options: [{ t: "想到什么就说什么，直接表达", v: "E" }, { t: "斟酌措辞，确保表达准确无误", v: "I" }] },
        { text: "你更喜欢哪种沟通方式？", options: [{ t: "面对面的交流，能看到表情和肢体语言", v: "E" }, { t: "书面文字交流，有充分的时间组织语言", v: "I" }] },
        { text: "当你需要放松时，你会选择：", options: [{ t: "约朋友出去吃饭、看电影", v: "E" }, { t: "听音乐、看书或独自散步", v: "I" }] },
        { text: "你更享受哪种课堂氛围？", options: [{ t: "互动频繁、小组讨论热烈的课堂", v: "E" }, { t: "老师讲授为主、安静听讲的课堂", v: "I" }] },

        { text: "你更倾向于认为自己是：", options: [{ t: "外部世界导向，喜欢行动", v: "E" }, { t: "内部世界导向，喜欢反思", v: "I" }] },
        { text: "在社交场合，你更关注：", options: [{ t: "周围正在发生什么，大家都在聊什么", v: "E" }, { t: "自己的内心感受和想法", v: "I" }] },
        { text: "你更喜欢的约会方式是：", options: [{ t: "去热闹的游乐场或音乐节", v: "E" }, { t: "去安静的博物馆或公园散步", v: "I" }] },

    // ================= 状态管理 =================
    let currentVersion = 'complete';
    let totalQuestions = 200;
    let currentQuestionIndex = 0;
    let userAnswers = []; 
    let currentQuizQuestions = [];

    // ================= 页面切换逻辑 =================
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // ================= 首页交互 =================
    function selectVersion(version, questions) {
        currentVersion = version;
        totalQuestions = questions;
        
        // 清除所有卡片的 active 状态
        document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
        
        // 给当前点击的卡片添加 active 状态
        document.getElementById('card-' + version).classList.add('active');
    }

    // ================= 测试逻辑 (与原版一致) =================
    function startQuiz() {
        currentQuestionIndex = 0;
        userAnswers = [];
        
        let shuffledBank = [...questionBank];
        for (let i = shuffledBank.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledBank[i], shuffledBank[j]] = [shuffledBank[j], shuffledBank[i]];
        }
        
        currentQuizQuestions = shuffledBank.slice(0, totalQuestions);
        showScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        const question = currentQuizQuestions[currentQuestionIndex];
        
        const progress = ((currentQuestionIndex + 1) / totalQuestions) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';
        document.getElementById('question-meta').innerText = `第 ${currentQuestionIndex + 1} 题 / 共 ${totalQuestions} 题`;
        document.getElementById('question-text').innerText = question.text;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        let shuffledOptions = [...question.options].sort(() => Math.random() - 0.5);

        shuffledOptions.forEach((option) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option.t;
            btn.onclick = () => selectOption(option.v, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(value, btnElement) {
        userAnswers[currentQuestionIndex] = value;
        document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
        btnElement.classList.add('selected');

        setTimeout(() => {
            nextQuestion();
        }, 250);
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < totalQuestions) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    // ================= 真实计分逻辑 (与原版一致) =================
    function finishQuiz() {
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        
        userAnswers.forEach(dim => {
            if (scores[dim] !== undefined) scores[dim]++;
        });

        let resultType = "";
        resultType += (scores.E >= scores.I) ? "E" : "I";
        resultType += (scores.S >= scores.N) ? "S" : "N";
        resultType += (scores.T >= scores.F) ? "T" : "F";
        resultType += (scores.J >= scores.P) ? "J" : "P";

        const resultData = getMBTIDescription(resultType);
        document.getElementById('result-type').innerText = resultType;
        document.getElementById('result-title').innerText = resultData.title;
        document.getElementById('result-desc').innerText = resultData.desc;

        showScreen('result-screen');
    }

            "INTP": { title: "逻辑学家", desc: "具有创造力的发明家，对知识有着止不住的渴望。你喜欢抽象思考，善于发现事物背后的规律和逻辑漏洞。" },
            "ENTJ": { title: "指挥官", desc: "大胆、富有想象力、意志强大的领导者，总能找到或创造解决方法。你善于组织资源，带领团队达成目标。" },
            "ENTP": { title: "辩论家", desc: "聪明好奇的思想者，不会放弃任何智力上的挑战。你喜欢头脑风暴，善于从不同角度看待问题。" },

            "INFP": { title: "调停者", desc: "诗意、善良的利他主义者，总是热情地为正当理由提供帮助。你内心充满理想，重视个人价值观和情感深度。" },
            "ENFJ": { title: "主人公", desc: "富有魅力、鼓舞人心的领导者，有使听众着迷的能力。你天生具有感染力，善于察觉他人的情绪并给予引导。" },
            "ENFP": { title: "竞选者", desc: "热情、有创造力、爱社交的自由人，总能找到理由微笑。你对生活充满好奇，善于发现新的可能性。" },
            "ISTJ": { title: "物流师", desc: "实际且注重事实的个人，可靠性不容怀疑。你做事有条理、有责任感，喜欢按照既定的规则和程序行事。" },
            "ISFJ": { title: "守卫者", desc: "非常专注而温暖的守护者，时刻准备着保护爱着的人们。你细心、体贴，对细节有惊人的记忆力。" },
            "ESTJ": { title: "总经理", desc: "出色的管理者，在管理事情或人的方面无与伦比。你重视秩序、结构和效率，是传统和规则的坚定维护者。" },
            "ESFJ": { title: "执政官", desc: "极有同情心、爱交往、受欢迎的人们，总是热心提供帮助。你重视和谐的人际关系，乐于为他人服务。" },
            "ISTP": { title: "鉴赏家", desc: "大胆而实际的实验家，擅长使用任何形式的工具。你冷静、理性，喜欢通过动手实践来解决问题。" },
            "ISFP": { title: "探险家", desc: "灵活有魅力的艺术家，时刻准备着探索和体验新鲜事物。你敏感、温和，活在当下，享受生活中的美好。" },
            "ESTP": { title: "企业家", desc: "聪明、精力充沛、善于感知的人，真心享受生活在边缘。你行动力强，喜欢冒险，善于应对突发状况。" },
            "ESFP": { title: "表演者", desc: "自发的、精力充沛而热情的表演者，生活在他们周围永不无聊。你热爱社交，善于活跃气氛，享受成为焦点的感觉。" }
        };
        return descriptions[type] || { title: "未知类型", desc: "暂无描述" };
    }

    function restart() {
        currentQuestionIndex = 0;
        userAnswers = [];
        showScreen('start-screen');
    }
